# Stage 1 visual model on GRID (unseen-speaker split). Intended for a Kaggle T4/P100 GPU.
index: /kaggle/working/grid_rois/index.jsonl
out_dir: /kaggle/working/runs/visual_grid
train_split: train
val_split: val
seed: 0

model:
  d_model: 256
  heads: 4
  layers: 12
  viseme_layer: 6
  frontend_width: 64
  dropout: 0.1

viseme_weight: 0.3       # loss = phoneme CTC + 0.3 * viseme CTC
epochs: 40
batch_size: 16
lr: 0.0006
weight_decay: 0.01
warmup_epochs: 2
grad_clip: 5.0
num_workers: 2
log_every: 100
val_batches: null        # null = full validation set
